<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kiralingo - Interactive Lesson</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "on-secondary-fixed-variant": "#3d6164",
                "on-surface-variant": "#5a605e",
                "surface-container": "#ecefec",
                "on-tertiary-fixed-variant": "#6d5e4f",
                "primary": "#3a674f",
                "tertiary-fixed-dim": "#eed9c6",
                "on-primary-container": "#2d5a43",
                "inverse-on-surface": "#9c9d9b",
                "tertiary-container": "#fde7d3",
                "on-error-container": "#752121",
                "on-tertiary-container": "#635445",
                "primary-fixed": "#bceecf",
                "secondary-fixed-dim": "#b4dcdf",
                "primary-container": "#bceecf",
                "on-background": "#2e3432",
                "background": "#f9f9f7",
                "inverse-primary": "#c7f9da",
                "on-primary-fixed-variant": "#37644d",
                "secondary-fixed": "#c2eaed",
                "primary-fixed-dim": "#aee0c2",
                "surface-container-highest": "#dee4e0",
                "on-secondary": "#e6fdff",
                "secondary-dim": "#34595c",
                "on-tertiary-fixed": "#504234",
                "inverse-surface": "#0d0f0e",
                "surface-bright": "#f9f9f7",
                "primary-dim": "#2e5b44",
                "on-tertiary": "#fff7f3",
                "tertiary": "#6c5c4d",
                "outline": "#767c79",
                "on-primary": "#e1ffea",
                "tertiary-dim": "#5f5142",
                "surface-dim": "#d4dcd8",
                "error": "#9f403d",
                "error-container": "#fe8983",
                "secondary-container": "#c2eaed",
                "on-secondary-container": "#33585a",
                "secondary": "#406568",
                "surface-variant": "#dee4e0",
                "on-error": "#fff7f6",
                "on-surface": "#2e3432",
                "outline-variant": "#adb3b0",
                "on-secondary-fixed": "#1f4548",
                "error-dim": "#4e0309",
                "surface-container-low": "#f3f4f2",
                "on-primary-fixed": "#194732",
                "surface-container-lowest": "#ffffff",
                "surface": "#f9f9f7",
                "surface-container-high": "#e5e9e6",
                "surface-tint": "#3a674f",
                "tertiary-fixed": "#fde7d3"
              },
              fontFamily: {
                "headline": ["Plus Jakarta Sans"],
                "body": ["Plus Jakarta Sans"],
                "label": ["Manrope"]
              },
              borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            },
          },
        }
      </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .aurora-gradient {
            background: linear-gradient(90deg, #3a674f 0%, #aee0c2 50%, #c2eaed 100%);
        }
        .pebble-shape-1 { border-radius: 45% 55% 50% 50%; }
        .pebble-shape-2 { border-radius: 55% 45% 48% 52%; }
        .pebble-shape-3 { border-radius: 50% 50% 45% 55%; }
        .runic-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 5l2 2-2 2-2-2 2-2zM5 20l2 2-2 2-2-2 2-2zm30 0l2 2-2 2-2-2 2-2zM20 35l2 2-2 2-2-2 2-2z' fill='%23adb3b0' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- Top Navigation Bar (Shared Component Strategy) -->
<header class="bg-[#f9f9f7] dark:bg-slate-900 sticky top-0 z-40">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-[#dee4e0] dark:hover:bg-slate-700 transition-colors rounded-full text-secondary">
<span class="material-symbols-outlined">close</span>
</button>
<!-- Progress Container -->
<div class="h-4 w-48 md:w-96 bg-surface-container rounded-full overflow-hidden relative">
<div class="aurora-gradient h-full w-2/3 rounded-full"></div>
</div>
</div>
<div class="flex items-center gap-3">
<div class="flex items-center gap-1 bg-surface-container-low px-3 py-1.5 rounded-full shadow-sm">
<span class="text-lg">7</span>
<span class="text-sm">🔥</span>
</div>
<div class="flex items-center gap-1 bg-surface-container-low px-3 py-1.5 rounded-full shadow-sm">
<span class="text-lg">120</span>
<span class="text-sm">💎</span>
</div>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center px-6 py-8 md:py-12 max-w-4xl mx-auto w-full">
<!-- Question Section -->
<section class="flex flex-col md:flex-row items-center md:items-end gap-8 mb-12 w-full">
<!-- Kira Character -->
<div class="relative w-48 h-48 md:w-64 md:h-64 flex-shrink-0">
<div class="absolute inset-0 bg-primary-container/20 rounded-[50%_50%_45%_55%] blur-2xl"></div>
<img alt="Kira AI Assistant" class="relative z-10 w-full h-full object-contain" data-alt="Illustration of a friendly female character named Kira wearing a chunky knit cream sweater and sage green scarf in a clean Nordic art style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwZ5tevMZHWpnzvMYq9f5eltjsUbh9tjbSCGjbI6QqVbuz7nnu3rdVEEJtHleOXZLA55X5pA3feBaOmGMT0TjwWeY2jQzhruD5txLVauX0FniB7xJe4KKRER4UaLV_eW2azhEtP3Hn4mmmTUFth2rOXdTaQ5Kq04128w_V4Yncnamo8YyJEJUPAiRtNEiVdU9j-7vbhwQz5vjR9xuy-N4OvBq5ywLienJ2LGgU51nuQtSez-dXQztflo0zR6-p-cwIEz6YN-h5j_65"/>
</div>
<!-- Speech Bubble -->
<div class="relative bg-surface-container-low p-8 rounded-xl md:rounded-lg runic-pattern border-none shadow-sm flex-grow">
<!-- Tail -->
<div class="absolute -bottom-3 left-1/2 -translate-x-1/2 md:-left-3 md:top-1/2 md:-translate-y-1/2 md:bottom-auto w-6 h-6 bg-surface-container-low rotate-45"></div>
<div class="relative z-10">
<p class="text-on-surface-variant font-label text-sm uppercase tracking-wider mb-2 font-bold">TRANSLATE THIS SENTENCE</p>
<h2 class="text-2xl md:text-3xl font-headline font-bold text-on-surface leading-tight">
                        How do you say <span class="text-primary italic">"Good morning"</span> in English?
                    </h2>
<button class="mt-4 flex items-center gap-2 text-primary font-bold hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">volume_up</span>
<span class="font-label">Listen</span>
</button>
</div>
</div>
</section>
<!-- Selected Words 'Shelf' -->
<section class="w-full min-h-[140px] mb-12 relative">
<div class="absolute bottom-0 left-0 w-full h-1.5 bg-tertiary-fixed-dim rounded-full"></div>
<div class="flex flex-wrap gap-4 justify-center items-center pb-6 min-h-[100px]">
<!-- Example of a selected word -->
<div class="pebble-shape-1 bg-surface-container-highest text-primary px-8 py-3 font-bold text-lg shadow-sm border border-primary/5">
                    Good
                </div>
<!-- Empty Placeholder -->
<div class="w-24 h-12 border-2 border-dashed border-outline-variant/30 rounded-xl"></div>
</div>
</section>
<!-- Word Bank (Pebble Shapes) -->
<section class="w-full grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 md:gap-6 mb-24">
<button class="pebble-shape-2 bg-surface-container-low hover:bg-surface-container-highest transition-all px-6 py-4 text-lg font-bold text-on-surface-variant shadow-sm flex justify-center items-center group">
<span class="group-active:scale-90 transition-transform">Morning</span>
</button>
<button class="pebble-shape-3 bg-surface-container-low hover:bg-surface-container-highest transition-all px-6 py-4 text-lg font-bold text-on-surface-variant shadow-sm flex justify-center items-center group">
<span class="group-active:scale-90 transition-transform">Afternoon</span>
</button>
<button class="pebble-shape-1 bg-surface-container-low hover:bg-surface-container-highest transition-all px-6 py-4 text-lg font-bold text-on-surface-variant shadow-sm flex justify-center items-center group">
<span class="group-active:scale-90 transition-transform">Night</span>
</button>
<button class="pebble-shape-2 bg-surface-container-low hover:bg-surface-container-highest transition-all px-6 py-4 text-lg font-bold text-on-surface-variant shadow-sm flex justify-center items-center group">
<span class="group-active:scale-90 transition-transform">Hello</span>
</button>
<button class="pebble-shape-3 bg-surface-container-low hover:bg-surface-container-highest transition-all px-6 py-4 text-lg font-bold text-on-surface-variant shadow-sm flex justify-center items-center group">
<span class="group-active:scale-90 transition-transform">Evening</span>
</button>
<button class="pebble-shape-1 bg-surface-container-low hover:bg-surface-container-highest transition-all px-6 py-4 text-lg font-bold text-on-surface-variant shadow-sm flex justify-center items-center group">
<span class="group-active:scale-90 transition-transform">Day</span>
</button>
</section>
</main>
<!-- Footer Action Area -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/80 backdrop-blur-xl py-8 px-6 z-50">
<div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
<button class="text-secondary font-bold font-label hover:underline transition-all order-2 md:order-1">
                SKIP QUESTION
            </button>
<!-- Primary Action with Aurora Accent -->
<div class="relative group order-1 md:order-2 w-full md:w-auto">
<div class="absolute -inset-1 aurora-gradient rounded-xl blur opacity-25 group-hover:opacity-50 transition-opacity"></div>
<button class="relative w-full md:w-64 bg-primary text-on-primary font-headline font-extrabold py-4 px-12 rounded-xl text-xl shadow-lg hover:bg-primary-dim active:scale-95 transition-all">
                    CHECK
                </button>
</div>
</div>
</footer>
<!-- Background Accents (Runic/Organic) -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 opacity-[0.03]">
<div class="absolute top-[10%] left-[5%] w-96 h-96 bg-secondary-fixed rounded-full blur-[120px]"></div>
<div class="absolute bottom-[20%] right-[10%] w-[500px] h-[500px] bg-tertiary-fixed rounded-full blur-[150px]"></div>
</div>
<!-- Feedback Modal Placeholder (Hidden by default, used for Variation 3 concept) -->
<div class="hidden fixed inset-x-0 bottom-0 z-[60] p-6 animate-slide-up">
<div class="max-w-4xl mx-auto bg-primary-container text-on-primary-container p-8 rounded-t-lg shadow-2xl flex items-center justify-between border-t-4 border-primary">
<div class="flex items-center gap-6">
<div class="w-16 h-16 bg-white/40 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div>
<h3 class="text-2xl font-bold font-headline">Excellent work!</h3>
<p class="font-label opacity-80 text-lg">You've mastered morning greetings.</p>
</div>
</div>
<button class="bg-primary text-on-primary px-10 py-4 rounded-xl font-bold text-lg shadow-md">
                CONTINUE
            </button>
</div>
</div>
</body></html>
